model:
  default: qwen3.8-flash-next
  provider: socialmedia-litellm
  base_url: null
custom_providers:
  - name: socialmedia-litellm
    base_url: null
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
platform_toolsets:
  api_server:
    - socialmedia
  cli: []
agent:
  max_turns: 12
  disabled_toolsets: []
mcp_servers:
  socialmedia:
    url: null
    headers: {}
    sampling:
      enabled: false
    tools:
      include:
        - social_read_current_chat
        - social_send_current_chat
